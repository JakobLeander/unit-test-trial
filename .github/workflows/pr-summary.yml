name: PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        id: coverage
        run: |
          python -m pytest --cov=helpers --cov-report=xml
          coverage_percent=$(python -c 'import xml.etree.ElementTree as ET; root = ET.parse("coverage.xml").getroot(); print("%.2f" % (float(root.attrib.get("line-rate", 0)) * 100))')
          echo "percent=$coverage_percent" >> "$GITHUB_OUTPUT"

      - name: Generate PR Summary
        uses: actions/github-script@v7
        env:
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.percent }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const coveragePercent = process.env.COVERAGE_PERCENT;

            // Get file changes
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const marker = '<!-- auto-generated-pr-description -->';
            if (!pr.body || pr.body.includes(marker)) {
              let description = `${marker}\n`;
              description += '## Summary\n\n';
              description += `This pull request changes ${files.length} file(s), with ${pr.additions} additions and ${pr.deletions} deletions.\n\n`;
              description += '## Files Changed\n\n';
              files.forEach(file => {
                description += `- \`${file.filename}\` (+${file.additions}, -${file.deletions})\n`;
              });
              description += '\n## Validation\n\n';
              description += `- Automated tests passed with ${coveragePercent}% code coverage (80% minimum).\n`;

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: description,
              });
            }