name: Coverage Check

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # Adjust to your Python version
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml
      
      - name: Check coverage threshold
        run: |
          coverage_percent=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('coverage.xml').getroot(); print(root.attrib.get('line-rate', 0))")
          coverage_int=$(python -c "print(int(float('$coverage_percent') * 100))")
          echo "Coverage: ${coverage_int}%"
          if [ $coverage_int -lt 80 ]; then
            echo "❌ Coverage is ${coverage_int}%, which is below 80%"
            exit 1
          else
            echo "✅ Coverage is ${coverage_int}%, which meets the 80% requirement"
          fi