name: Auto Review PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov flake8
      
      - name: Run linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Run tests with coverage
        run: python -m pytest --tb=short --cov=helpers --cov-report=term-missing --cov-fail-under=80
      
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: '✅ Automated Review Passed\n\n- Tests executed successfully\n- Code quality checked\n- Coverage is at least 80%',
              event: 'COMMENT'
            })