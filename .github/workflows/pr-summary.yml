name: PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Get file changes
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const marker = '<!-- auto-generated-pr-description -->';
            if (!pr.body) {
              let description = `${marker}\n`;
              description += '## Summary\n\n';
              description += `This pull request changes ${files.length} file(s), with ${pr.additions} additions and ${pr.deletions} deletions.\n\n`;
              description += '## Files Changed\n\n';
              files.forEach(file => {
                description += `- \`${file.filename}\` (+${file.additions}, -${file.deletions})\n`;
              });
              description += '\n## Validation\n\n';
              description += '- Automated tests and the 80% coverage gate run in CI.\n';

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: description,
              });
            }