name: PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const totalAdditions = files.reduce((sum, f) => sum + f.additions, 0);
            const totalDeletions = files.reduce((sum, f) => sum + f.deletions, 0);

            const pyFiles = files.filter(f => f.filename.endsWith(".py"));
            const testFiles = files.filter(f => /test/i.test(f.filename));
            const docsFiles = files.filter(f => /readme|docs/i.test(f.filename));
            const workflowFiles = files.filter(f => f.filename.includes(".github"));
            const configFiles = files.filter(f =>
              /requirements|pyproject|setup|tox|Makefile/i.test(f.filename)
            );

            const summaryParts = [];

            if (pyFiles.length) {
              const helperCount = pyFiles.filter(f => f.filename.includes("helpers")).length;
              const extra = helperCount ? "helper utilities" : "Python logic";
              summaryParts.push(`Updated ${extra} and added functionality across ${pyFiles.length} Python file(s).`);
            }

            if (testFiles.length) {
              const testLines = testFiles.reduce((sum, f) => sum + f.additions, 0);
              summaryParts.push(`Expanded validation with ${testLines} lines of test coverage to exercise edge cases and expected behavior.`);
            }

            if (docsFiles.length || workflowFiles.length || configFiles.length) {
              const docBits = [];
              if (docsFiles.length) docBits.push("documentation");
              if (workflowFiles.length) docBits.push("CI workflow");
              if (configFiles.length) docBits.push("project config");
              summaryParts.push(`Adjusted ${docBits.join(", ")} to keep the project aligned and easier to maintain.`);
            }

            let summary = summaryParts.join(" ");
            if (!summary) {
              summary = "Updated the project with targeted changes across the codebase.";
            }

            const fileList = files
              .map(f => `- \`${f.filename}\` (+${f.additions}, -${f.deletions})`)
              .join("\n");

            const marker = "<!-- auto-generated-pr-description -->";
            const body = [
              marker,
              "## Summary",
              "",
              summary,
              "",
              "## Statistics",
              "",
              `- Files changed: ${files.length}`,
              `- Additions: +${totalAdditions}`,
              `- Deletions: -${totalDeletions}`,
              "",
              "## Files Changed",
              "",
              fileList,
              "",
              "## Validation",
              "",
              "- Automated tests and the 80% coverage gate run in CI."
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body
            });